<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>專題展示</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: white;
}

/* 標題 */
header {
    padding: 15px 20px;
    background: #1a1a1a;
    font-size: 20px;
    font-weight: bold;
}

/* 主體 */
.container {
    display: flex;
    height: calc(100vh - 120px); /* 留空給 footer */
}

/* 左側 */
.left {
    width: 35%;
    border-right: 1px solid #333;
    overflow-y: auto;
    padding: 15px;
}

/* 右側 */
.right {
    flex: 1;
    padding: 20px;
}

/* 卡片 */
.card {
    background: #1e1e1e;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: 0.2s;
    border: 1px solid #2a2a2a;
}

.card:hover {
    background: #2a2a2a;
    transform: scale(1.02);
}

.card.active {
    border: 1px solid #00d4ff;
    background: #262626;
}

/* 影片 */
video {
    width: 100%;
    max-height: 80vh;
    background: black;
    border-radius: 10px;
    border: 1px solid #333;
}

/* 分區標題 */
.section-title {
    margin-bottom: 10px;
    color: #aaa;
    font-size: 14px;
}

/* Footer GitHub */
footer {
    height: 60px;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    border-top: 1px solid #333;
}

footer a {
    color: #00d4ff;
    text-decoration: none;
    font-weight: bold;
}

footer a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<header>
🎓 專題展示
</header>

<div class="container">

    <!-- 左側列表 -->
    <div class="left">
        <div class="section-title">影片列表</div>
        <div id="list"></div>
    </div>

    <!-- 右側播放 -->
    <div class="right">
        <div class="section-title">播放區</div>
        <video id="player" controls></video>
    </div>

</div>

<!-- GitHub 區塊 -->
<footer>
    🔗 GitHub：
    <a href="https://github.com/your-repo" target="_blank">
        https://github.com/your-repo
    </a>
</footer>

<script>

let currentActive = null;

async function loadFiles() {
    let res = await fetch("/api/files");
    let data = await res.json();

    let list = document.getElementById("list");
    list.innerHTML = "";

    data.forEach(item => {
        let div = document.createElement("div");
        div.className = "card";
        div.innerText = item.name;

        div.onclick = () => {
            playVideo(item.file, div);
        };

        list.appendChild(div);
    });
}

function playVideo(filename, element) {
    let player = document.getElementById("player");
    player.src = "/api/video/" + filename;
    player.play();

    if (currentActive) {
        currentActive.classList.remove("active");
    }

    element.classList.add("active");
    currentActive = element;
}

loadFiles();

</script>

</body>
</html>
